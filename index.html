<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#17172b"><title>누나, 좋은 밤 보내요 🌙</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;color:#fff;font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:radial-gradient(ellipse at 50% 110%,#45345f 0%,#20203d 45%,#101426 100%);display:flex;align-items:center;justify-content:center;padding:24px}.sky{position:fixed;inset:0;pointer-events:none}.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.8;animation:twinkle 2.5s infinite alternate}@keyframes twinkle{to{opacity:.18;transform:scale(.55)}}.moon{position:absolute;top:11%;right:14%;font-size:64px;filter:drop-shadow(0 0 22px #fff4b5);animation:float 4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-9px)}}.card{position:relative;width:min(100%,440px);padding:36px 25px 32px;text-align:center;border:1px solid #ffffff26;border-radius:30px;background:#ffffff0e;backdrop-filter:blur(9px);box-shadow:0 20px 70px #0005}.small{font-size:12px;letter-spacing:.22em;color:#d9c8ee}h1{font-size:clamp(29px,8vw,39px);line-height:1.4;margin:17px 0 12px}p{font-size:15px;line-height:2;color:#e5dced;margin:0}.sleep{font-size:47px;margin:15px 0 18px;display:block;animation:float 3.5s ease-in-out infinite}button{margin-top:25px;border:0;border-radius:99px;padding:14px 24px;background:linear-gradient(100deg,#e9c5ff,#f6d7df);color:#493755;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px #d6b3ff38}#message{display:none;margin-top:22px;padding:17px 13px;border-radius:18px;background:#ffffff12;color:#fff0f7;font-size:15px;line-height:1.9}.foot{margin-top:25px;font-size:12px;color:#b9a9ce}
</style></head><body><div class="sky" id="sky"><div class="moon">🌙</div></div><main class="card"><div class="small">A LITTLE GOOD NIGHT WISH</div><span class="sleep">🌌</span><h1>누나, 오늘도<br>수고 많았어요 💜</h1><p>오늘 하루도 정말 고생했어요.<br>이제는 모든 걱정을 잠시 내려놓고<br>편안하게 쉬었으면 좋겠어요.</p><button onclick="showWish()">누르시면 작은 선물이 열려요 ✨</button><div id="message">오늘 밤은 예쁜 꿈만 꾸고,<br>내일은 오늘보다 더 많이 웃어요.<br><br>따뜻하게 이불 덮고 푹 자요.<br>누나의 밤이 별처럼 반짝이길 바라요. 🌷<br><br><b>잘 자요, 누나. 좋은 꿈 꿔요 ❤️</b></div><div class="foot">From. 알리</div></main><script>const sky=document.getElementById('sky');for(let i=0;i<65;i++){const s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=(Math.random()*3)+'s';s.style.opacity=(.25+Math.random()*.7);sky.appendChild(s)}function showWish(){document.getElementById('message').style.display='block';document.querySelector('button').textContent='좋은 꿈 꿔요 💗'}</script></body></html>
